<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Ok Rock Brazil</title>
    <link rel="icon" type="image/png" href="imagens/aba-logo.png">
    <link rel="stylesheet" href="oorbr.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar section-content">
            <a href="" class="nav-logo">
                <img src="imagens/logo-img.png" alt="" class="nav-logo-img">
            </a>
            <div class="nav-menu">
                <ul>
                    <li class="nav-item">
                        <img src="" alt="" class="nav-item-img-link">
                        <a href="#" class="nav-item-link">Home</a>
                    </li>
                    <li class="nav-item">
                        <img src="" alt="" class="nav-item-img-link">
                        <a href="#" class="nav-item-link">Sobre</a>
                    </li>
                    <li class="nav-item">
                        <img src="" alt="" class="nav-item-img-link">
                        <a href="#" class="nav-item-link">Discografia</a>
                    </li>
                    <li class="nav-item">
                        <img src="" alt="" class="nav-item-img-link">
                        <a href="#" class="nav-item-link">Vídeos</a>
                    </li>
                    <li class="nav-item">
                        <img src="" alt="" class="nav-item-img-link">
                        <a href="#" class="nav-item-link">Eventos</a>
                    </li>
                    <li class="nav-item">
                        <img src="" alt="" class="nav-item-img-link">
                        <a href="#" class="nav-item-link">Fórum</a>
                    </li>
                    <li class="nav-item">
                        <img src="" alt="" class="nav-item-img-link">
                        <a href="#" class="nav-item-link">Equipe</a>
                    </li>
                    <li class="nav-item">
                        <img src="" alt="" class="nav-item-img-link">
                        <a href="#" class="nav-item-link">Social</a>
                    </li>
                    <div class="pesquisa-container">
                    <input type="text" class="pesquisa-input" placeholder="Pesquisar...">
                    <button class="pesquisa-btn">
                        <!-- SVG para barra de pesquisa-->
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </button>
                </div>
                </ul>
            </div>
        </nav>
    </header>
    <main>
    <section class="main-section">

        <div class="main-image"> <!-- Imagem em sua própria div - irmã do main-content -  impede que a imagem seja renderizada em cima do conteúdo -->
            <img src="imagens/main-image-oor.png" alt="">
        </div>

        <div class="main-content">
            <div class="main-details">
                <p class="info-main">FAN SITE NÃO OFICIAL</p>

                <h1 class="oor-main-subtitle">ONE OK ROCK</h1>

                <p class="description-main">
                    Vídeos traduzidos, comunidade, eventos e tudo sobre a maior banda de rock do Japão.
                </p>

                <div class="btn-main">
                    <a href="#" class="btn-disco">
                        <i class="fa-solid fa-compact-disc"></i>
                        Discografia</a>
                    <a href="#" class="btn-comunidade">
                        <i class="fa-solid fa-arrows-down-to-people"></i>
                        Comunidade</a>
                </div>

                <div class="indicador-scroll">
                    <div class="mouse">
                        <span></span>
                    </div>
                </div>
            </div>
        </div>

    </section>
</main>

    <script src="oorbr.js" defer></script>
</body>
</html>
